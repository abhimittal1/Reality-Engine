name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -e ".[dev]"
        
    - name: Check syntax
      run: |
        python -m compileall reality_engine
        
    # We do not run full tests that require a webcam/GUI in the CI. 
    # Just compiling ensures that there are no syntax errors or missing dependencies 
    # that would prevent the application from importing.