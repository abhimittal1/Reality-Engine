[project]
name = "reality-engine"
version = "0.1.0"
description = "A real-time computer vision application manipulating webcam feeds using hand gestures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "mediapipe",
    "numpy",
    "scipy",
    "ultralytics"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout"
]
